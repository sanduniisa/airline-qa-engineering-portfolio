$kind: http-request
name: 'Catalog Product Offerings Search'
order: 2000
method: POST
url: '{{travelport_api_base_url}}/11/air/catalog/search/catalogproductofferings'
headers:
  - key: Accept-Encoding
    value: 'gzip, deflate'
  - key: Authorization
    value: 'Bearer {{access_token}}'
  - key: Content-Type
    value: application/json
  - key: TVP-PCC-Core
    value: '{{pcc_gds}}'
  - key: TraceId
    value: TraceID_123456789
body:
  type: json
  content: |-
    {
      "@type": "CatalogProductOfferingsQueryRequest",
      "CatalogProductOfferingsRequest": {
        "@type": "CatalogProductOfferingsRequestAir",
        "maxNumberOfUpsellsToReturn": 4,
        "contentSourceList": [
          "GDS"
        ],
        "PassengerCriteria": [
          {
            "@type": "PassengerCriteria",
            "number": 1,
            "passengerTypeCode": "ADT"
          }
        ],
        "SearchCriteriaFlight": [
          {
            "@type": "SearchCriteriaFlight",
            "departureDate": "2026-12-11",
            "From": {
              "value": "JFK"
            },
            "To": {
              "value": "LAX"
            }
          }
        ],
        "SearchModifiersAir": {
          "@type": "SearchModifiersAir",
          "CarrierPreference": [
            {
              "@type": "CarrierPreference",
              "preferenceType": "Preferred",
              "carriers": [
                "AA"
              ]
            }
          ]
        }
      }
    }
